<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị — BRG Shopping</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="wrap">
      <h1 class="text-[22px] mb-1.5">Trang quản trị</h1>
      <p class="text-muted mb-5">Quản lý danh mục, sản phẩm và đơn hàng.</p>

      <div id="admin-guard"></div>

      <div id="admin-app" hidden>
        <div class="tabs">
          <button data-tab="categories" class="active">Danh mục</button>
          <button data-tab="products">Sản phẩm</button>
          <button data-tab="orders">Đơn hàng</button>
          <button data-tab="news">Tin tức</button>
          <button data-tab="promotions">Khuyến mại</button>
          <button data-tab="chat">Chat hỗ trợ</button>
          <button data-tab="users">Người dùng</button>
        </div>

        <section id="tab-categories">
          <div class="panel mb-[18px]">
            <h3>Thêm danh mục</h3>
            <div class="form-error" id="category-error"></div>
            <form id="category-form" class="form-grid">
              <div class="form-row">
                <label for="cat-name">Tên danh mục</label>
                <input id="cat-name" name="name" required>
              </div>
              <div class="form-row">
                <label for="cat-image">Ảnh (URL, tuỳ chọn)</label>
                <input id="cat-image" name="imageUrl" placeholder="https://...">
              </div>
              <button type="submit" class="btn btn-primary col-span-full justify-self-start">Thêm danh mục</button>
            </form>
          </div>
          <div class="panel">
            <h3>Danh sách danh mục</h3>
            <div id="category-table"></div>
          </div>
        </section>

        <section id="tab-products" hidden>
          <div class="panel mb-[18px]">
            <h3>Thêm sản phẩm</h3>
            <div class="form-error" id="product-error"></div>
            <form id="product-form" class="form-grid">
              <div class="form-row">
                <label for="p-name">Tên sản phẩm</label>
                <input id="p-name" name="name" required>
              </div>
              <div class="form-row">
                <label for="p-category">Danh mục</label>
                <select id="p-category" name="categoryId" required></select>
              </div>
              <div class="form-row">
                <label for="p-price">Giá bán (₫)</label>
                <input id="p-price" name="price" type="number" min="0" required>
              </div>
              <div class="form-row">
                <label for="p-sale">Giá khuyến mãi (₫, tuỳ chọn)</label>
                <input id="p-sale" name="salePrice" type="number" min="0">
              </div>
              <div class="form-row">
                <label for="p-stock">Tồn kho</label>
                <input id="p-stock" name="stockQuantity" type="number" min="0" value="0" required>
              </div>
              <div class="form-row">
                <label for="p-sku">SKU (tuỳ chọn)</label>
                <input id="p-sku" name="sku">
              </div>
              <div class="form-row col-span-full">
                <label for="p-desc">Mô tả</label>
                <textarea id="p-desc" name="description" rows="2"></textarea>
              </div>
              <button type="submit" class="btn btn-primary col-span-full justify-self-start">Thêm sản phẩm</button>
            </form>
          </div>
          <div class="panel">
            <h3>Danh sách sản phẩm</h3>
            <div id="product-table"></div>
          </div>
        </section>

        <section id="tab-orders" hidden>
          <div class="panel">
            <h3>Tất cả đơn hàng</h3>
            <div id="order-table"></div>
          </div>
        </section>

        <section id="tab-news" hidden>
          <div class="panel mb-[18px]">
            <h3>Đăng tin tức</h3>
            <div class="form-error" id="news-error"></div>
            <form id="news-form">
              <div class="form-row">
                <label for="n-title">Tiêu đề</label>
                <input id="n-title" name="title" required>
              </div>
              <div class="form-row">
                <label for="n-summary">Tóm tắt (tuỳ chọn)</label>
                <input id="n-summary" name="summary">
              </div>
              <div class="form-row">
                <label for="n-image">Ảnh bìa (URL, tuỳ chọn)</label>
                <input id="n-image" name="imageUrl" placeholder="https://...">
              </div>
              <div class="form-row">
                <label for="n-content">Nội dung</label>
                <textarea id="n-content" name="content" rows="6" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary justify-self-start">Đăng tin</button>
            </form>
          </div>
          <div class="panel">
            <h3>Danh sách tin tức</h3>
            <div id="news-table"></div>
          </div>
        </section>

        <section id="tab-promotions" hidden>
          <div class="panel mb-[18px]">
            <h3>Tạo chương trình khuyến mại</h3>
            <div class="form-error" id="promotion-error"></div>
            <form id="promotion-form" class="form-grid">
              <div class="form-row">
                <label for="pr-title">Tên chương trình</label>
                <input id="pr-title" name="title" required>
              </div>
              <div class="form-row">
                <label for="pr-code">Mã khuyến mại (tuỳ chọn)</label>
                <input id="pr-code" name="code" placeholder="VD: SALE50">
              </div>
              <div class="form-row">
                <label for="pr-type">Loại giảm giá</label>
                <select id="pr-type" name="discountType">
                  <option value="percent">Phần trăm (%)</option>
                  <option value="fixed">Số tiền cố định (₫)</option>
                </select>
              </div>
              <div class="form-row">
                <label for="pr-value">Giá trị giảm</label>
                <input id="pr-value" name="discountValue" type="number" min="0" required>
              </div>
              <div class="form-row">
                <label for="pr-min">Đơn tối thiểu (₫)</label>
                <input id="pr-min" name="minOrderAmount" type="number" min="0" value="0">
              </div>
              <div class="form-row">
                <label for="pr-max">Giảm tối đa (₫, tuỳ chọn)</label>
                <input id="pr-max" name="maxDiscountAmount" type="number" min="0">
              </div>
              <div class="form-row">
                <label for="pr-start">Ngày bắt đầu</label>
                <input id="pr-start" name="startDate" type="date" required>
              </div>
              <div class="form-row">
                <label for="pr-end">Ngày kết thúc</label>
                <input id="pr-end" name="endDate" type="date" required>
              </div>
              <div class="form-row col-span-full">
                <label for="pr-desc">Mô tả (tuỳ chọn)</label>
                <textarea id="pr-desc" name="description" rows="2"></textarea>
              </div>
              <button type="submit" class="btn btn-primary col-span-full justify-self-start">Tạo chương trình</button>
            </form>
          </div>
          <div class="panel">
            <h3>Danh sách khuyến mại</h3>
            <div id="promotion-table"></div>
          </div>
        </section>

        <section id="tab-chat" hidden>
          <div class="chat-admin-layout">
            <div class="panel" id="chat-conv-list"></div>
            <div class="panel" id="chat-thread">
              <p class="text-muted">Chọn một cuộc trò chuyện để xem.</p>
            </div>
          </div>
        </section>

        <section id="tab-users" hidden>
          <div class="panel mb-[18px]">
            <h3>Thêm người dùng</h3>
            <div class="form-error" id="user-error"></div>
            <form id="user-form" class="form-grid">
              <div class="form-row">
                <label for="u-name">Họ và tên</label>
                <input id="u-name" name="fullName" required>
              </div>
              <div class="form-row">
                <label for="u-email">Email</label>
                <input id="u-email" name="email" type="email" required>
              </div>
              <div class="form-row">
                <label for="u-phone">Số điện thoại (tuỳ chọn)</label>
                <input id="u-phone" name="phone">
              </div>
              <div class="form-row">
                <label for="u-password">Mật khẩu</label>
                <input id="u-password" name="password" type="password" minlength="6" required>
              </div>
              <div class="form-row">
                <label for="u-role">Vai trò</label>
                <select id="u-role" name="role">
                  <option value="customer">Khách hàng</option>
                  <option value="admin">Quản trị viên</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary col-span-full justify-self-start">Tạo người dùng</button>
            </form>
          </div>
          <div class="panel">
            <h3>Danh sách người dùng</h3>
            <div id="user-table"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="/js/pages/admin.js"></script>
</body>
</html>
