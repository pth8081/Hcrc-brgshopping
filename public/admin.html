<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị — BRG Shopping</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="wrap">
      <h1 style="font-size:22px; margin-bottom:6px;">Trang quản trị</h1>
      <p style="color:var(--muted); margin-bottom:20px;">Quản lý danh mục, sản phẩm và đơn hàng.</p>

      <div id="admin-guard"></div>

      <div id="admin-app" hidden>
        <div class="tabs">
          <button data-tab="categories" class="active">Danh mục</button>
          <button data-tab="products">Sản phẩm</button>
          <button data-tab="orders">Đơn hàng</button>
        </div>

        <section id="tab-categories">
          <div class="panel" style="margin-bottom:18px;">
            <h3>Thêm danh mục</h3>
            <div class="form-error" id="category-error"></div>
            <form id="category-form" class="form-grid">
              <div class="form-row">
                <label for="cat-name">Tên danh mục</label>
                <input id="cat-name" name="name" required>
              </div>
              <div class="form-row">
                <label for="cat-image">Ảnh (URL, tuỳ chọn)</label>
                <input id="cat-image" name="imageUrl" placeholder="https://...">
              </div>
              <button class="btn btn-primary" type="submit" style="grid-column:1/-1; justify-self:start;">Thêm danh mục</button>
            </form>
          </div>
          <div class="panel">
            <h3>Danh sách danh mục</h3>
            <div id="category-table"></div>
          </div>
        </section>

        <section id="tab-products" hidden>
          <div class="panel" style="margin-bottom:18px;">
            <h3>Thêm sản phẩm</h3>
            <div class="form-error" id="product-error"></div>
            <form id="product-form" class="form-grid">
              <div class="form-row">
                <label for="p-name">Tên sản phẩm</label>
                <input id="p-name" name="name" required>
              </div>
              <div class="form-row">
                <label for="p-category">Danh mục</label>
                <select id="p-category" name="categoryId" required></select>
              </div>
              <div class="form-row">
                <label for="p-price">Giá bán (₫)</label>
                <input id="p-price" name="price" type="number" min="0" required>
              </div>
              <div class="form-row">
                <label for="p-sale">Giá khuyến mãi (₫, tuỳ chọn)</label>
                <input id="p-sale" name="salePrice" type="number" min="0">
              </div>
              <div class="form-row">
                <label for="p-stock">Tồn kho</label>
                <input id="p-stock" name="stockQuantity" type="number" min="0" value="0" required>
              </div>
              <div class="form-row">
                <label for="p-sku">SKU (tuỳ chọn)</label>
                <input id="p-sku" name="sku">
              </div>
              <div class="form-row" style="grid-column:1/-1;">
                <label for="p-desc">Mô tả</label>
                <textarea id="p-desc" name="description" rows="2"></textarea>
              </div>
              <button class="btn btn-primary" type="submit" style="grid-column:1/-1; justify-self:start;">Thêm sản phẩm</button>
            </form>
          </div>
          <div class="panel">
            <h3>Danh sách sản phẩm</h3>
            <div id="product-table"></div>
          </div>
        </section>

        <section id="tab-orders" hidden>
          <div class="panel">
            <h3>Tất cả đơn hàng</h3>
            <div id="order-table"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="/js/pages/admin.js"></script>
</body>
</html>
