<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRG Shopping — Mua sắm trực tuyến</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="wrap">
      <div class="hero">
        <div>
          <span class="tag">Demo giao diện</span>
          <h1>Mua sắm dễ dàng, giao nhanh tận nơi</h1>
          <p>Toàn bộ dữ liệu bên dưới được lấy trực tiếp từ API Node.js chạy trên MSSQL — không phải dữ liệu tĩnh.</p>
        </div>
        <div class="price-badge">
          <div class="small">Miễn phí vận chuyển</div>
          <div class="big">từ 500K</div>
        </div>
      </div>

      <div class="section-head">
        <h2 id="list-title">Tất cả sản phẩm</h2>
        <span class="count" id="list-count"></span>
      </div>

      <div class="grid" id="product-grid">
        <div class="card"><div class="thumb skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="card"><div class="thumb skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="card"><div class="thumb skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="card"><div class="thumb skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="/js/pages/home.js"></script>
</body>
</html>
