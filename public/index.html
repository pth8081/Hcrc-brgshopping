<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRG Shopping — Mua sắm trực tuyến</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="hero-carousel" id="hero-carousel"></div>

    <div class="wrap">
      <div class="catgrid-section" id="catgrid-section" hidden>
        <h2>Danh mục sản phẩm</h2>
        <div class="catgrid" id="catgrid"></div>
      </div>

      <div class="promo-banner" id="promo-banner">
        <div>
          <h3>Giao hàng tận nhà</h3>
          <p>Đặt hàng online, nhận hàng tận nơi — thanh toán khi nhận hàng hoặc chuyển khoản đều tiện lợi.</p>
        </div>
        <div class="promo-tiers">
          <div class="promo-tier"><div class="fee">Miễn phí</div><div class="cond">Đơn từ 500.000₫</div></div>
          <div class="promo-tier"><div class="fee">20.000₫</div><div class="cond">Đơn dưới 500.000₫</div></div>
        </div>
      </div>

      <div class="section-head">
        <h2 id="list-title">Tất cả sản phẩm</h2>
        <span class="count" id="list-count"></span>
      </div>

      <div class="grid" id="product-grid">
        <div class="card"><div class="thumb skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="card"><div class="thumb skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="card"><div class="thumb skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
        <div class="card"><div class="thumb skeleton"></div><div class="card-body"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:14px;width:40%"></div></div></div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="/js/pages/home.js"></script>
</body>
</html>
