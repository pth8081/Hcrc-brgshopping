<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — BRG Shopping</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="wrap">
      <div class="panel auth-card">
        <h3>Tạo tài khoản mới</h3>
        <div class="social-login" id="social-login" hidden>
          <button type="button" class="btn-social" id="google-login-btn" hidden>
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6.1 29.5 4 24 4c-7.5 0-14 4.2-17.3 10.4z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.4l-6.5-5.5C29.5 34.7 26.9 35.7 24 35.7c-5.3 0-9.7-3.4-11.3-8l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.5 5.5C41.4 36 44 30.6 44 24c0-1.4-.1-2.5-.4-3.5z"/></svg>
            Đăng ký bằng Google
          </button>
          <button type="button" class="btn-social btn-facebook" id="facebook-login-btn" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
            Đăng ký bằng Facebook
          </button>
          <div class="auth-divider">hoặc dùng email</div>
        </div>
        <div class="form-error" id="form-error"></div>
        <form id="register-form">
          <div class="form-row">
            <label for="fullName">Họ và tên</label>
            <input type="text" id="fullName" name="fullName" required autocomplete="name">
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="form-row">
            <label for="phone">Số điện thoại</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel">
          </div>
          <div class="form-row">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
          </div>
          <div class="form-row">
            <label for="captchaText">Nhập mã xác nhận</label>
            <div class="captcha-row">
              <div class="captcha-img" id="captcha-img" aria-label="Mã captcha"></div>
              <button type="button" class="btn btn-outline btn-sm" id="captcha-refresh" title="Đổi mã khác">⟳</button>
            </div>
            <input type="text" id="captchaText" name="captchaText" required autocomplete="off" placeholder="Nhập ký tự trong ảnh trên">
          </div>
          <button class="btn btn-primary btn-block" type="submit">Đăng ký</button>
        </form>
        <p class="form-hint">Đã có tài khoản? <a href="/login.html" class="text-brand-dark font-semibold">Đăng nhập</a></p>
        <p class="form-hint">Chỉ ghé mua một lần? <a href="/checkout.html" class="text-brand-dark font-semibold">Đặt hàng không cần tài khoản →</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
