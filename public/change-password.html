<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đổi mật khẩu — BRG Shopping</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="wrap">
      <div class="panel auth-card">
        <h3>Đổi mật khẩu</h3>
        <div class="form-error" id="form-error"></div>
        <p class="info-note show" id="social-only-note" hidden>
          Tài khoản của bạn đang đăng nhập bằng Google/Facebook và chưa có mật khẩu. Đặt một mật khẩu ở đây để có thể đăng nhập bằng email/mật khẩu sau này.
        </p>
        <form id="change-password-form">
          <div class="form-row" id="current-password-row">
            <label for="currentPassword">Mật khẩu hiện tại</label>
            <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password">
          </div>
          <div class="form-row">
            <label for="newPassword">Mật khẩu mới</label>
            <input type="password" id="newPassword" name="newPassword" required minlength="6" autocomplete="new-password">
          </div>
          <div class="form-row">
            <label for="confirmPassword">Nhập lại mật khẩu mới</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password">
          </div>
          <button class="btn btn-primary btn-block" type="submit">Đổi mật khẩu</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="/js/pages/changePassword.js"></script>
</body>
</html>
