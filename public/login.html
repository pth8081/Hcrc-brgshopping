<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — BRG Shopping</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="wrap">
      <div class="panel auth-card">
        <h3>Đăng nhập</h3>
        <div class="form-error" id="form-error"></div>
        <form id="login-form">
          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="form-row">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
        </form>
        <p class="form-hint">Chưa có tài khoản? <a href="/register.html" class="text-brand-dark font-semibold">Đăng ký ngay</a></p>
        <p class="form-hint">Tài khoản demo admin: <code>admin@brgshopping.local</code> / <code>ChangeMe123!</code></p>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
